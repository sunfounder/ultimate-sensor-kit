# .readthedocs.yaml
# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details

# Required
version: 2

# Set the OS, Python version and other tools you might need
build:
  os: ubuntu-22.04
  tools:
    python: "3.11"
    # You can also specify other tool versions:
    # nodejs: "19"
    # rust: "1.64"
    # golang: "1.19"

# Build documentation in the "docs/" directory with Sphinx
sphinx:
   configuration: docs/source/conf.py

# Additional formats (PDF / ePub) are intentionally NOT built.
# Read the Docs dumps the LaTeX sources - and every figure - into the pdf
# output directory and then refuses to upload it because it contains more
# than one file. HTML is what the site serves, so we build only that.
# To get a PDF again, build it locally:
#   python -m sphinx -b latex docs/source _latex && make -C _latex

# Optional but recommended, declare the Python requirements required
# to build your documentation
# See https://docs.readthedocs.io/en/stable/guides/reproducible-builds.html
python:
   install:
   - requirements: docs/requirements.txt